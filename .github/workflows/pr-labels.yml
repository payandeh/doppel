name: Label pull request

on:
  # zizmor: ignore[dangerous-triggers] -- never checks out PR code; needed so labels work on fork PRs.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const types = {
              feat: 'enhancement',
              fix: 'bug',
              docs: 'documentation',
              perf: 'performance',
              refactor: 'refactor',
              test: 'tests',
              build: 'build/ci',
              ci: 'build/ci',
              chore: 'chore',
              style: 'chore',
              revert: 'chore'
            };
            const pr = context.payload.pull_request;
            const match = /^(\w+)(\(([^)]+)\))?(!)?:/.exec(pr.title);
            const wanted = new Set();
            if (match && types[match[1]]) wanted.add(types[match[1]]);
            if (match && (match[4] || /BREAKING CHANGE/.test(pr.body || ''))) wanted.add('breaking change');
            if (match && match[3] === 'deps') wanted.add('dependencies');
            const managed = new Set([...Object.values(types), 'breaking change']);
            const current = pr.labels.map((l) => l.name);
            const { owner, repo } = context.repo;
            for (const name of current) {
              if (managed.has(name) && !wanted.has(name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
              }
            }
            const add = [...wanted].filter((name) => !current.includes(name));
            if (add.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: add });
