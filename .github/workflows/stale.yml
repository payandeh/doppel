name: Stale

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Mark stale issues and pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,good first issue,help wanted,needs triage
          exempt-pr-labels: pinned,security,dependencies
          exempt-draft-pr: true
          stale-issue-message: >
            This issue has had no activity for 60 days, so it's marked as stale. It will be closed in 14 days
            unless there's new activity. Comment if it's still relevant.
          stale-pr-message: >
            This pull request has had no activity for 30 days, so it's marked as stale. It will be closed in
            14 days unless there's new activity.
          close-issue-message: Closed because it was stale. Feel free to reopen with more details.
          close-pr-message: Closed because it was stale. Feel free to reopen when you pick it up again.
